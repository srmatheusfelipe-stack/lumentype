<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Resultado — LumenType</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;900&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase.js?v=7" defer></script>
  <script src="js/resultado.js?v=7" defer></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: Nunito, system-ui, sans-serif; }
    body { background: #eef5f9; color: #2f3e4e; padding: 24px; }
    #conteudo { max-width: 900px; margin: 0 auto; background: #fff; border-radius: 16px; padding: 32px; box-shadow: 0 10px 30px rgba(0,0,0,.08); }

    .cab { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; border-bottom: 3px solid #eef2f5; padding-bottom: 16px; margin-bottom: 20px; }
    .cab h1 { font-size: 1.6rem; }
    .cab p { color: #7a8894; font-weight: 800; flex: 1; }
    .imp { background: #007bb5; color: #fff; border: none; border-radius: 10px; padding: 10px 18px; font-weight: 900; cursor: pointer; }

    h2 { font-size: 1.15rem; margin: 24px 0 10px; color: #007bb5; text-transform: uppercase; letter-spacing: .5px; }

    .podio { display: flex; gap: 12px; flex-wrap: wrap; }
    .pod { flex: 1; min-width: 180px; border: 3px solid #eef2f5; border-radius: 14px; padding: 14px; text-align: center; }
    .pod1 { border-color: #fbc531; background: #fffdf3; }
    .pod2 { border-color: #c6ced6; } .pod3 { border-color: #dda87e; }
    .pm { font-size: 2rem; }
    .pnome { font-weight: 900; text-transform: uppercase; font-size: 1.1rem; }
    .ppts { font-weight: 900; color: #007bb5; }
    .psub { font-size: .82rem; color: #7a8894; font-weight: 800; }

    table { width: 100%; border-collapse: collapse; }
    .premios td { padding: 9px 8px; border-bottom: 1px solid #eef2f5; font-weight: 800; }
    .premios .pi { width: 34px; font-size: 1.2rem; }
    .premios .pt { width: 190px; }
    .premios .pn { text-transform: uppercase; }
    .premios .pv { color: #7a8894; font-size: .88rem; }
    .nota, .obs { color: #9aa7b2; font-weight: 800; font-size: .82rem; margin-top: 6px; }

    .turma { margin-top: 6px; font-size: .9rem; }
    .turma th { text-align: left; padding: 8px 6px; border-bottom: 2px solid #dbe3ea; font-size: .78rem; text-transform: uppercase; color: #7a8894; }
    .turma td { padding: 7px 6px; border-bottom: 1px solid #eef2f5; font-weight: 800; }
    .turma .nome { text-transform: uppercase; }
    .turma tr:nth-child(-n+3) td { background: #fffdf3; }

    .med { margin-top: 16px; background: #eef7fc; border-radius: 12px; padding: 12px 16px; font-weight: 800; }
    .rodape { margin-top: 16px; color: #e07b39; font-weight: 900; }
    .erro { color: #e74c3c; font-weight: 900; }

    @media print {
      body { background: #fff; padding: 0; }
      #conteudo { box-shadow: none; border-radius: 0; max-width: 100%; padding: 0; }
      .imp { display: none; }
      h2 { break-after: avoid; }
      tr { break-inside: avoid; }
    }
  </style>
</head>
<body>
  <div id="conteudo"><p style="text-align:center;color:#7a8894;font-weight:800">Carregando resultado...</p></div>
</body>
</html>
